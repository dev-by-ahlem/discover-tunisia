<body>

  <!-- =====================================================
       NAVBAR — same as all pages
  ====================================================== -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">

      <a class="navbar-brand" href="index.html">
        <img src="assets/images/logo.png" alt="Discover Tunisia Logo">
        <em>Discover Tunisia</em>
      </a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarMenu"
              aria-controls="navbarMenu"

      </button>

      <div class="collapse navbar-collapse" id="navbarMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

    </div>
  </nav>


  <!-- =====================================================
       HERO — Google Map of Tunisia
       Real interactive map so tourists can
       explore Tunisia before contacting us
  ====================================================== -->
  <section class="contact-hero">

    <!-- Title block sits above the map -->
    <div class="contact-hero-text">
      <p class="hero-tag">Find Your Way</p>
      <h1>Explore <span>Tunisia</span> on the Map</h1>
      <p class="hero-sub">Click around — your next adventure is waiting</p>
    </div>

    <!-- Google Maps iframe — shows full Tunisia -->
    <div class="contact-map">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3541455.0!2d7.5!3d33.8!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x12fd5c2ab6b3e27d%3A0xeae69da7f5a0b93e!2sTunisia!5e0!3m2!1sen!2stn!4v1"
        width="100%"
        height="100%"
        style="border:0;"
        allowfullscreen=""
        loading="lazy">
      </iframe>
    </div>

  </section>

       FOOTER — same as all pages
  ====================================================== -->

    <div class="container">

        &copy; 2026 Discover Tunisia. All rights reserved.
